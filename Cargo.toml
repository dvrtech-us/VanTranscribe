[workspace]
members = ["crates/vt-core", "crates/vt-record", "crates/vt-capture", "crates/vt-stt", "crates/vt-summarize", "crates/vt-playback", "crates/vt-diarize", "crates/vt-dsp", "crates/vt-speakers", "crates/vt-speaker-frontend", "crates/vt-session", "src-tauri", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.91"

[workspace.dependencies]
vt-core = { path = "crates/vt-core" }
vt-record = { path = "crates/vt-record" }
vt-capture = { path = "crates/vt-capture" }
vt-stt = { path = "crates/vt-stt" }
vt-session = { path = "crates/vt-session" }
vt-summarize = { path = "crates/vt-summarize" }
vt-playback = { path = "crates/vt-playback" }
vt-diarize = { path = "crates/vt-diarize" }
vt-dsp = { path = "crates/vt-dsp" }
vt-speakers = { path = "crates/vt-speakers" }
vt-speaker-frontend = { path = "crates/vt-speaker-frontend" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1.29.0", features = ["v4"] }
flacenc = { version = "0.5.1", default-features = false }
rusqlite = { version = "0.41.1", features = ["bundled"] }
sha2 = "0.10.9"
thiserror = "2.0.17"
tempfile = "3.23.0"
claxon = "0.4.3"
zeroize = "1.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
