[package]
name = "vt-speaker-frontend"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.91"
build = "build.rs"
description = "Pinned native reference-style WeSpeaker frontend for explicit local research"

[features]
default = []
feature-probe = []

[dependencies]
sha2 = "0.10.9"
thiserror = "2.0.17"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
sherpa-onnx = { version = "=2.0.1", default-features = false, features = ["static"] }
sherpa-onnx-sys = { version = "=2.0.1", default-features = false, features = ["static"] }

[build-dependencies]
cc = "=1.11.1"
serde_json = "1.0.145"
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.23.0"
serde_json = "1.0.145"

[[example]]
name = "feature_probe"
required-features = ["feature-probe"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
